name: Build & Release VIC

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install musl tools (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y musl-tools gcc-aarch64-linux-gnu

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build binary
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare artifacts
        shell: bash
        run: |
          mkdir -p dist
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            cp target/${{ matrix.target }}/release/vic.exe dist/vic-windows-x86_64.exe
            cp target/${{ matrix.target }}/release/media.exe dist/windows-media.exe
            cp target/${{ matrix.target }}/release/top.exe dist/windows-top.exe
            cp target/${{ matrix.target }}/release/mouse.exe dist/windows-mouse.exe
          elif [[ "${{ matrix.target }}" == "x86_64-unknown-linux-musl" ]]; then
            cp target/${{ matrix.target }}/release/vic dist/vic-linux-x86_64
            cp target/${{ matrix.target }}/release/media dist/linux-media
            cp target/${{ matrix.target }}/release/top dist/linux-top
            cp target/${{ matrix.target }}/release/mouse dist/linux-mouse
          elif [[ "${{ matrix.target }}" == "aarch64-unknown-linux-musl" ]]; then
            cp target/${{ matrix.target }}/release/vic dist/vic-linux-aarch64
          elif [[ "${{ matrix.target }}" == "aarch64-apple-darwin" ]]; then
            cp target/${{ matrix.target }}/release/vic dist/vic-macos-aarch64
            cp target/${{ matrix.target }}/release/media dist/mac-media
            cp target/${{ matrix.target }}/release/top dist/mac-top
            cp target/${{ matrix.target }}/release/mouse dist/mac-mouse
          fi
          cd dist
          for f in *; do
            if [[ -f "$f" && "$f" != *.sha256 ]]; then
              if command -v sha256sum >/dev/null 2>&1; then
                sha256sum "$f" | awk '{print $1}' > "$f.sha256"
              elif command -v shasum >/dev/null 2>&1; then
                shasum -a 256 "$f" | awk '{print $1}' > "$f.sha256"
              fi
            fi
          done
          ls -la

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
